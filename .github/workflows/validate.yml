name: validate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mission control
        run: npm ci --prefix mission-control
      - name: Install product checks
        run: npm ci --prefix product/checks
      - name: Run the validation gate (product, mission control, machine)
        run: node validate.mjs
      - name: Keep the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation
          path: logbook/validation.json
