<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Team Chat (Plate)</title>
    <style>
      body { font: 15px/1.5 -apple-system, system-ui, sans-serif; margin: 0; background: #fafafa; }
      header { padding: 12px 20px; border-bottom: 1px solid #ddd; background: #fff; }
      .editor { max-width: 900px; margin: 20px auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px 24px; min-height: 70vh; outline: none; }
      .editor p { margin: 4px 0; }
      .composer { max-width: 900px; margin: 20px auto 0; }
      .composer input { width: 100%; box-sizing: border-box; font: inherit; padding: 10px 14px; border: 1px solid #bbb; border-radius: 8px; }
      .control { max-width: 1200px; margin: 16px auto 0; padding: 0 16px; }
      .cards { display: grid; grid-template-columns: repeat(3, 1fr) 120px; gap: 12px; }
      .card { background: #fff; border: 1px solid #ddd; border-top: 4px solid; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .dot { font-size: 12px; } .dot::before { content: '●'; margin-right: 4px; } .dot.on::before { color: #2f9e44; } .dot.off::before { color: #adb5bd; }
      .said { font-size: 13px; color: #333; min-height: 36px; } .meta { font-size: 12px; color: #777; }
      .pending { color: #e8590c; font-weight: 600; } .ok { color: #2f9e44; font-weight: 600; }
      .control button { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid #bbb; border-radius: 6px; background: #f8f9fa; cursor: pointer; }
      .control button:hover { background: #e9ecef; }
      .stop { background: #e03131 !important; color: #fff; font-weight: 800 !important; border: 0 !important; font-size: 16px !important; }
      .order { display: flex; gap: 8px; margin-top: 12px; } .order input { flex: 1; font: inherit; padding: 9px 12px; border: 1px solid #bbb; border-radius: 8px; }
      .order select { font: inherit; padding: 0 8px; border-radius: 8px; }
      .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      .preview { margin-top: 12px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 8px; }
      .preview iframe { width: 100%; height: 520px; border: 0; margin-top: 6px; }
      .ro { color: #e8590c; font-weight: 600; }
      .gate { margin-bottom: 12px; padding: 10px 14px; border-radius: 8px; border: 1px solid #ddd; background: #fff; font-size: 14px; }
      .gate.green { border-color: #2f9e44; background: #ebfbee; } .gate.red { border-color: #e03131; background: #fff5f5; }
      .gate .fail { color: #c92a2a; font-size: 13px; margin-top: 4px; }
      @media (max-width: 800px) { .cards { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
